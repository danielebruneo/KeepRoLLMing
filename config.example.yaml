# KeepRoLLMing — minimal, working configuration
#
# Copy this file to config.yaml, then replace the model name and upstream URL.
# For every supported setting, see config.example.full.yaml.

# Defaults inherited by routes that do not provide their own value.
ctx_len: 32768
max_tokens: 4096
default_request_timeout: 120

# Recommended network boundary. Replace 192.168.1.0/24 with your LAN's actual
# subnet. Only add a reverse proxy to trusted_proxies if it is the direct
# network peer seen by KRM. Existing deployments retain `any` unless this
# policy is configured.
client_access:
  default: lan
  lan_networks:
    - "127.0.0.0/8"
    - "::1/128"
    - "192.168.1.0/24"
  trusted_proxies: []

# Broad process-wide guard before JSON parsing. It protects against accidental
# or hostile OOM-sized requests; increase it only for genuinely huge payloads.
request_limits:
  max_body_bytes: 67108864  # 64 MiB

# Shared upstream HTTP pool. Route request_timeout still controls each request.
upstream_transport:
  max_connections: 100
  max_keepalive_connections: 20
  keepalive_expiry: 30
  pool_timeout: 10
  connect_timeout: 60

routes:
  # A private base route shares the upstream settings without being advertised
  # through GET /v1/models.
  base/local:
    is_private: true
    model: "your-upstream-model"
    upstream_url: "http://127.0.0.1:8080"

  # Send clients to this route with: "model": "chat/local".
  chat/local:
    extends: base/local
    pattern: "chat/local"

  # Optional basic smart-routing pattern. Uncomment and set a second worker
  # URL when two independent upstream instances are available. `queue_timeout`
  # is a single budget shared by target selection and backend admission.
  #
  # chat/worker-b:
  #   model: "your-upstream-model"
  #   upstream_url: "http://127.0.0.1:8081"
  #   max_concurrent: 1
  #   # For a shared multi-request worker instead, use max_concurrent: 4 and
  #   # allow_idle_reservation: false (default true). Affinity is retained.
  #
  # chat/balanced:
  #   extends: base/local
  #   pattern: "chat/balanced"
  #   max_concurrent: 1
  #   queue_timeout: 15
  #   balance:
  #     selection_policy: least_loaded  # Optional; default: priority
  #     promotion:
  #       lookahead_turns: 5  # Additional equivalent turns; 0 = current only
  #       expected_new_prompt_tokens: 8192
  #       expected_completion_tokens: 1024
  #       expected_current_completion_tokens: 1024  # Forecast, not max_tokens
  #       # Optional fallback evidence tuning; see config.example.full.yaml.
  #       metrics:
  #         history_max_age_seconds: 86400
  #     targets:
  #       - {route: chat/local, priority: 100}
  #       - {route: chat/worker-b, priority: 80}

  # The same backend with two optional reliability filters enabled.
  code/assistant:
    extends: base/local
    pattern: "code/assistant"
    filters:
      system_prompt:
        enabled: true
        prompt: "You are a concise coding assistant."
        override: false
      model_nudge:
        enabled: true
        trigger_patterns: [":$"]
        nudge_message: "Continue."
        max_attempts: 3

observability:
  projectors:
    plain:
      level: BASIC
      stdout: true
  raw_trace:
    policy: disabled  # disabled | all | selected_routes
