[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    asyncio: async test
    e2e_fake: end-to-end tests against the fake backend
    e2e_live: end-to-end tests against a real backend
    non_parallelizable: tests that cannot run in parallel due to shared resources
    red: adversarial regression scenario retained as a protocol contract

# The default suite must report every failure. Developers may still pass
# --maxfail=1 while iterating locally.
