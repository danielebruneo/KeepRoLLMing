# KeepRoLLMing — complete configuration reference
#
# This file demonstrates every currently supported public configuration key.
# It is valid as-is, but uses placeholder upstream URLs, model names and API
# keys. Copy only the routes and filters you need into config.yaml.

# Root defaults and summary behaviour
upstream_base_url: "http://127.0.0.1:8080"
# Accepted client keys inherited by routes. Empty means no global key check;
# public/demo below supplies its own keys. This is NOT upstream authentication.
api_keys: []
# Network source policy for clients. Replace the example LAN subnet and list
# only reverse proxies that KRM sees as the direct TCP peer.
client_access:
  default: lan
  lan_networks: ["127.0.0.0/8", "::1/128", "192.168.1.0/24"]
  trusted_proxies: []
ctx_len: 32768
max_tokens: 4096
# Fallback only when root max_tokens is omitted; NOT a switch for clamping.
default_max_completion_tokens: 4096
summary_enabled: true
passthrough_enabled: false
default_request_timeout: 120
# Process-wide, pre-parse request guard. It applies before route resolution so
# it also bounds chunked bodies. This intentionally broad default is 64 MiB.
request_limits:
  max_body_bytes: 67108864
# Shared HTTP pool; individual routes still set `request_timeout`.
upstream_transport:
  max_connections: 100
  max_keepalive_connections: 20
  keepalive_expiry: 30
  pool_timeout: 10
  connect_timeout: 60
performance_logs_dir: "__performance_logs"
# Write the dashboard snapshot after the first request and then every N
# completed requests. Lower values refresh the dashboard sooner at more I/O.
performance:
  summary_update_interval: 20
summary_max_tokens: 512
safety_margin_tok: 128
summary_mode: "cache_append"
summary_cache_enabled: true
summary_cache_dir: "__summary_cache"
summary_cache_fingerprint_msgs: 1
summary_min_raw_tail: 1
summary_force_consolidate: 0
summary_consolidate_when_needed: 1
log_payload_max_chars: 20000000

# Optional JSON request snapshot for targeted diagnosis. Captures the effective
# upstream payload after routing/repacking, BEFORE request filters; despite the
# historical raw_inbound filename, this is not the original client body or the
# exact post-filter wire request. Output: __request_captures__/date/req_id/.
# May contain sensitive messages/tools. Set selected_routes only temporarily.
request_capture:
  policy: disabled  # disabled | all | selected_routes
  selected_routes: ["debug/raw-trace"]
body_capture:
  policy: errors_only  # errors_only (default) | disabled; error payloads may be sensitive.

# Logging projections and opt-in raw transport capture.
observability:
  # Opt in when operational telemetry must never persist user/model content.
  # It preserves route/model/timing/usage facts, but omits transcripts,
  # reasoning, tool payloads and raw transport bytes from every sink.
  privacy_mode: false
  # Bounded FIFO for optional PLAIN/JSON/server projections. It keeps file
  # writes off streaming requests; overflow is reported as a WARN event.
  projector_queue_size: 2048
  projectors:
    json:
      enabled: true
      level: INFO
      path: "keeprollming.log.json"
      max_bytes: 104857600
      backup_count: 5
    plain:
      enabled: true
      level: BASIC
      path: "keeprollming.log"
      stdout: true
      max_bytes: 52428800
      backup_count: 5
    server:
      enabled: true
      level: INFO
      path: "server.log"
      max_bytes: 52428800
      backup_count: 5
  raw_trace:
    policy: selected_routes  # disabled | all | selected_routes
    selected_routes: ["debug/raw-trace"]
    path: "__raw_traces__"
    max_bytes_per_request: 20971520

routes:
  # Base routes can be composed with `extends`; private routes are not exposed
  # by GET /v1/models.
  base/local:
    is_private: true
    model: "your-local-model"
    upstream_url: "http://127.0.0.1:8080"
    ctx_len: 32768
    max_tokens: 4096
    summary_enabled: true
    passthrough_enabled: false
    request_timeout: 120
    # Route work governor. Every resolved route defaults to one concurrent
    # request; this base intentionally permits two and queues for five seconds.
    max_concurrent: 2
    # Resource-owned veto, inherited by aliases; default true. Set false on a
    # shared worker so no balance source can reserve the whole idle backend.
    allow_idle_reservation: true
    queue_timeout: 5
    # Cross-route service-class priority when several routes resolve to the
    # same upstream URL and model. Higher queued work runs first; active work
    # is never interrupted. Omit it for the default FIFO priority of zero.
    routing_priority: 0
    # Optional starvation protection for bounded admission queues. The policy
    # is disabled when omitted; an older waiter gains one priority point every
    # 30 seconds, capped at +20, and never preempts a live request.
    queue_aging:
      interval_seconds: 30
      priority_step: 1
      max_boost: 20
    # Optional first-token scheduling pressure. It is server-owned and stays
    # neutral until the selected backend has enough recent TTFT observations.
    deadline_policy:
      enabled: false
      # first_token_budget_ms: 8000
      # urgency_window_ms: 5000
      # max_priority_boost: 20
      # ttft_safety_factor: 1.5
      # min_samples: 5
    # Optional upstream health breaker. After three terminal upstream failures
    # it opens for 60 seconds; a declared fallback model can still be used.
    circuit_breaker_enabled: true
    failure_threshold: 3
    recovery_timeout: 60
    # Static, operator-defined route features. These are inherited by child
    # routes and are exposed by the private GET /routes status endpoint.
    capabilities: ["chat", "streaming", "tools", "reasoning"]

  base/remote:
    is_private: true
    model: "remote-chat-model"
    upstream_url: "https://api.example.com"
    api_key: "replace-me"
    upstream_headers:
      X-Example-Header: "replace-me"
    capabilities: ["chat", "streaming"]

  # Standard route fields
  chat/local:
    extends: base/local
    pattern: "chat/local"
    summary_model: "your-fast-summary-model"
    transform_reasoning_content: false
    add_empty_content_when_reasoning_only: false
    reasoning_placeholder_content: "<thought>Reasoning omitted</thought>"
    overrides:
      temperature: 0.7
      top_p: 0.95
      # Optional backend-specific sampling controls; remove unsupported fields.
      top_k: 20
      min_p: 0.05
      repetition_penalty: 1.05
      frequency_penalty: 0.0
      presence_penalty: 0.0
      seed: 42
      stop: ["<END_OF_REPLY>"]
      max_tokens: 2048
      # The same top-level field used by LibreChat's reasoning-effort control.
      # The accepted values depend on the upstream model/runtime.
      reasoning_effort: high

  chat/remote:
    extends: base/remote
    pattern: "chat/remote"

  # Publicly reachable only with this client key.
  public/demo:
    extends: base/local
    pattern: "public/demo"
    client_access: public
    api_keys: ["replace-with-a-client-secret"]

  # A fallback chain is evaluated after an upstream failure. Fallback entries
  # are tried in declaration order. `cost_priority` is accepted for
  # compatibility but does not influence current routing decisions.
  chat/resilient:
    extends: base/local
    pattern: "chat/resilient"
    fallback_chain: ["chat/remote"]
    cost_priority: 100

  # A balancing selector reroutes each request to one independently resolved
  # concrete route. Targets must not be private. Target priority is the default
  # ordering and breaks equal-load ties under least_loaded; session pins win.
  code/runner-a:
    extends: base/local
    pattern: "code/runner-a"
    upstream_url: "http://127.0.0.1:8081"
    max_concurrent: 1
    # Optional estimate for a new backend without measured evidence.
    # Demonstration values only: replace with your own measurements.
    performance_hint:
      prompt_tps: 2000
      completion_tps: 80

  code/runner-b:
    extends: base/local
    pattern: "code/runner-b"
    upstream_url: "http://127.0.0.1:8082"
    max_concurrent: 1
    # Omit hints to stay pinned when measured rates are unavailable.
    performance_hint:
      prompt_tps: 800
      completion_tps: 40
    # Disable an inherited hint instead: performance_hint: {enabled: false}

  # Shared overflow capacity: four mixed coding/bot requests can use this
  # resource. Affinity/promotion remain enabled, but no exclusive idle lease
  # is created, even when the source uses idle_reservation.mode: session.
  code/shared-worker:
    extends: base/local
    upstream_url: "http://127.0.0.1:8083"
    max_concurrent: 4
    allow_idle_reservation: false

  public/code:
    extends: base/local
    pattern: "public/code"
    # This is the client-facing service class. It owns queue tolerance and
    # priority; each selected target owns its backend capacity.
    queue_timeout: 20
    routing_priority: 0
    deadline_policy:
      enabled: true
      first_token_budget_ms: 12000
      urgency_window_ms: 5000
      max_priority_boost: 20
      ttft_safety_factor: 1.5
      min_samples: 5
    overrides:
      reasoning_effort: high
    balance:
      # priority (default): prefer target priority until capacity is exhausted.
      # least_loaded: prefer fewer active requests, priority breaks ties.
      # Applies to new assignments; preserves session reservation/affinity.
      selection_policy: least_loaded
      # Capability declarations are advisory by default. Turn this on only
      # once every target's capabilities are complete and maintained.
      enforce_capabilities: false
      targets:
        - route: code/runner-a
          priority: 100
        - route: code/runner-b
          priority: 80
      # Preserve explicitly named source route overrides across the reroute.
      preserve_overrides: [reasoning_effort]
      # Carry every filter configured on this source route into the selected
      # target. Use a list instead to preserve only named modules.
      preserve_filters: all
      # At each new request boundary, promote an assigned session to a better
      # available target only when observed PP/decode rates justify the cold
      # prefill cost. Defaults to true; false keeps it pinned until lease expiry.
      promote_when_beneficial: true
      # Defaults below project additional turns using fixed assumptions.
      # Cold-prefix migration is charged once; future turns process only new
      # prompt tokens and expected completion. No history/log parsing required.
      promotion:
        lookahead_turns: 5  # Fractions allowed; 0 restores current-turn-only
        expected_new_prompt_tokens: 8192
        expected_completion_tokens: 1024
        expected_current_completion_tokens: 1024  # Does not change API max_tokens
        # Recent measured rates first; otherwise stable URL+model history;
        # optional per-backend performance_hint is the last fallback.
        metrics:
          recent_min_samples: 3
          history_min_samples: 6
          history_max_age_seconds: 86400  # Age of the latest observation; <= 7 days
          max_history_cv: 0.5  # Max coefficient of variation of either rate
          historical_margin_ratio: 0.20  # Require >20% projected gain
          configured_margin_ratio: 0.35  # Require >35% with configured hints
      # Preserve a warm agent backend when a long decode is followed shortly
      # by a much smaller prompt, the common Qwen Code context-compaction shape.
      # A one-shot continuation also covers the next prompt rewrite when the
      # first system message retains its beginning and end. Both steps are
      # heuristic (not a session ID) and enabled by default.
      compaction_handoff:
        enabled: true
        max_age_seconds: 60
        min_context_ratio: 0.80
        min_completion_tokens: 5000
        min_prompt_reduction_ratio: 0.50
      # Remember session affinity for an hour and reserve the selected idle
      # resource for that session only. This prevents another agent session
      # from evicting a warm prefix between tool-call turns.
      affinity_ttl_seconds: 3600
      idle_reservation:
        enabled: true
        mode: session
        timeout_seconds: 900
        # Do not reserve a backend after a tiny title/review turn.  Requiring
        # a reported cache hit also avoids leasing a cold backend.
        min_prompt_tokens: 4096
        min_cached_prompt_tokens: 2048
      # Wait/re-evaluate all candidates within queue_timeout before reporting
      # capacity exhaustion. At the deadline, a soft idle reservation may be
      # bypassed; capacity, health and compatibility never are.
      selection_retry_interval_ms: 250
      allow_reservation_bypass: true
    # Applied only after every balance target (and a target's own fallback)
    # has failed before emitting client-visible output.
    fallback_chain: ["chat/remote"]

  # A higher-priority client group may share runner-a with public/code. The
  # two routes contend at that physical backend resource, not independently.
  code/priority:
    extends: code/runner-a
    pattern: "code/priority"
    routing_priority: 100

  # Raw traces are intentionally limited to explicitly selected routes.
  debug/raw-trace:
    extends: base/local
    pattern: "debug/raw-trace"

  # Request-only filters. Priority may override the module default when an
  # integration requires it; YAML order has no semantic meaning.
  filters/system-prompt:
    extends: base/local
    pattern: "filters/system-prompt"
    filters:
      system_prompt:
        enabled: true
        # Relative paths are resolved from this config file, not from the
        # directory where `krm` is launched. Use `prompt` instead for a short
        # inline instruction; the two settings are mutually exclusive.
        # prompt: "You are a concise coding assistant."  # Remove prompt_file to use this.
        prompt_file: "prompts/examples/code-assistant.md"
        override: false

  filters/summarization:
    extends: base/local
    pattern: "filters/summarization"
    filters:
      summarization:
        enabled: true

  filters/multimodal:
    extends: base/local
    pattern: "filters/multimodal"
    filters:
      multimodal_validator:
        enabled: true
        strip_orphaned_markers: true
        marker_patterns: ["<__media__>", "<image>"]
        log_level: "warning"
        max_images: 4
        # strip_first retains the newest 4 images; strip_latest retains the oldest 4.
        max_images_policy: "strip_first"
        max_images_replacement_text: "[image omitted]"
        strip_all_images: false
        # Opt in to strip PDF/file attachments from every message, including history.
        # Real images and extracted plain text remain usable.
        strip_all_files: false
        files_replacement_text: "[File omitted: attachments are disabled]"
        strip_last_image_max_retries: 1
        strip_last_image_on_error: false

  # Filters with stream hooks. They are separated here so their documented
  # defaults never create an accidental priority collision in one route.
  filters/tool-rewrite:
    extends: base/local
    pattern: "filters/tool-rewrite"
    filters:
      tool_rewrite:
        enabled: true
        supported_patterns: ["nested", "separate"]

  filters/timestamp:
    extends: base/local
    pattern: "filters/timestamp"
    filters:
      timestamp:
        enabled: true
        priority: 110
        template: "[Timestamp: {timestamp}]"
        timezone: "UTC"
        tail_buffer_size: 512
        always: false
        format: "%Y-%m-%d %H:%M:%S UTC"

  filters/model-nudge:
    extends: base/local
    pattern: "filters/model-nudge"
    filters:
      model_nudge:
        enabled: true
        trigger_patterns: [":$"]
        action: "nudge"
        nudge_message: "Continue."
        max_attempts: 3
        nudge_on_empty: false
        nudge_fallback_message: "The response ended unexpectedly."
        max_retries: 2
        tail_buffer_size: 1024
        upstream_url: "http://127.0.0.1:8080"
        api_key: "replace-me"

  filters/tool-loop-stopper:
    extends: base/local
    pattern: "filters/tool-loop-stopper"
    filters:
      model_tool_loop_stopper:
        enabled: true
        max_repeats: 3  # Detection threshold, independent of recovery budget.
        max_retries: 2  # Recovery calls allowed per request; 0 means fallback immediately.
        # max_attempts: 2  # Alias used only when max_retries is absent.
        retry_timeout: 120  # Optional; omitted = inherit the selected route timeout.
        tls_message: "Choose a different action."
        nudge_message: "Continue with a different tool call."
        fallback_message: "Repeated tool call stopped."
        fallback_streaming_message: "Repeated tool call stopped."
        fallback_template: "Repeated call: {name}({args})"
        trigger_patterns: [".*"]
        fuzzy_max_repeats: 3
        fuzzy_look_back: 5
        fuzzy_threshold: 0.9
        send_user_message: false
        ab_loop_detection: true
        upstream_url: "http://127.0.0.1:8080"
        api_key: "replace-me"

  filters/reasoning-loop-stopper:
    extends: base/local
    pattern: "filters/reasoning-loop-stopper"
    filters:
      reasoning_loop_stopper:
        enabled: true
        max_repeats: 3  # Requires preceding matching reasoning in the request history.
        max_retries: 2
        # max_attempts: 2  # Alias used only when max_retries is absent.
        retry_timeout: 120  # Optional; omitted = inherit the selected route timeout.
        intervention_message: "I notice I'm repeating myself. I will change approach."
        rls_message: "Use a different line of reasoning."
        fallback_message: "Repeated reasoning stopped."
        fallback_streaming_message: "Repeated reasoning stopped."
        send_user_message: false
        detect_within_stream_loop: false  # Experimental streaming-only within-turn detection.
        upstream_url: "http://127.0.0.1:8080"
        api_key: "replace-me"
